[package]
name = "alpha"
version = "1.0.0"
description = "Alpha desktop shell"
edition = "2021"
publish = false

# Desktop-only shell (spec 9: the Tauri run is a measurement target, not a
# feature surface). The Tauri 2 template also builds `staticlib` and `cdylib`
# for iOS/Android; Alpha has no mobile target, so only the `rlib` the desktop
# binary links against is built. Add the other two back if mobile is ever in
# scope. The `_lib` suffix keeps the library name distinct from the binary.
[lib]
name = "alpha_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# No plugins: the front end opens no URLs, touches no files and runs no shell
# commands. Diagnostics run in the web view; their one IPC call reads the Tauri
# version (`plugin:app|tauri_version`), which `core:default` already allows.
[dependencies]
tauri = { version = "2", features = [] }

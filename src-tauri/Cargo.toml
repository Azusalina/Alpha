[package]
name = "alpha"
version = "1.0.0"
description = "Alpha desktop shell"
edition = "2021"
publish = false

# Desktop-only shell (spec 9: the Tauri run is a measurement target, not a
# feature surface). The Tauri 2 template also builds `staticlib` and `cdylib`
# for iOS/Android; Alpha has no mobile target, so only the `rlib` the desktop
# binary links against is built. Add the other two back if mobile is ever in
# scope. The `_lib` suffix keeps the library name distinct from the binary.
[lib]
name = "alpha_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# No shell/filesystem plugins. The host owns the fixed Python backend process;
# the main local webview gets only brain_call and the diagnostic version read.
[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

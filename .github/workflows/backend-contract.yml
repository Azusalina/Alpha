name: Backend contract

on:
  push:
    paths:
      - 'back-end-core/**'
      - '.github/workflows/backend-contract.yml'
  pull_request:
    paths:
      - 'back-end-core/**'
      - '.github/workflows/backend-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Clone the pinned local tokenizer reference
        run: |
          git clone https://github.com/fxsjy/jieba.git ext-refs/jieba
          git -C ext-refs/jieba checkout --detach 67fa2e36e72f69d9134b8a1037b83fbb070b9775
      - name: Install test-only schema validator
        working-directory: back-end-core
        run: python -m pip install '.[test-schema]'
      - name: Validate synthetic backend fixtures
        working-directory: back-end-core
        run: |
          python -c 'from jsonschema import Draft202012Validator'
          python -m unittest discover -s tests -v
          python -m unittest discover -s translator -p 'test_*.py' -v
